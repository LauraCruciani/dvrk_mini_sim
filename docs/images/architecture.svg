<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 10; }
      .t { font-size: 15px; font-weight: bold; fill: #1d1f22; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #444; text-anchor: middle; }
      .topic { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #2a2a2a; }
      .ln { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- browser -->
  <rect class="box" x="20" y="175" width="150" height="90" fill="#eef1f5" stroke="#6b7785"/>
  <text class="t" x="95" y="207">Browser</text>
  <text class="s" x="95" y="226">endoscope view</text>
  <text class="s" x="95" y="242">three.js · mouse, keys</text>

  <!-- console -->
  <rect class="box" x="230" y="165" width="170" height="110" fill="#e6ecf7" stroke="#3d5a99"/>
  <text class="t" x="315" y="195">console</text>
  <text class="s" x="315" y="214">MTML + MTMR (masters)</text>
  <text class="s" x="315" y="230">foot pedals</text>
  <text class="s" x="315" y="246">web server + WebSocket</text>

  <!-- teleop -->
  <rect class="box" x="470" y="55" width="170" height="80" fill="#fdf0de" stroke="#d98a1c"/>
  <text class="t" x="555" y="88">MTMR_PSM1</text>
  <text class="s" x="555" y="107">teleop: scale, clutch,</text>
  <text class="s" x="555" y="122">tremor filter, delay</text>
  <rect class="box" x="470" y="305" width="170" height="80" fill="#e5f4e8" stroke="#3f9a55"/>
  <text class="t" x="555" y="338">MTML_PSM2</text>
  <text class="s" x="555" y="357">teleop: scale, clutch,</text>
  <text class="s" x="555" y="372">tremor filter, delay</text>

  <!-- arms -->
  <rect class="box" x="785" y="55" width="150" height="80" fill="#fdf0de" stroke="#d98a1c"/>
  <text class="t" x="860" y="88">PSM1</text>
  <text class="s" x="860" y="107">right instrument</text>
  <text class="s" x="860" y="122">RCM at x = +50 mm</text>
  <rect class="box" x="785" y="180" width="150" height="80" fill="#eceff1" stroke="#6f7c85"/>
  <text class="t" x="860" y="213">ECM</text>
  <text class="s" x="860" y="232">camera arm</text>
  <text class="s" x="860" y="247">(the endoscope)</text>
  <rect class="box" x="785" y="305" width="150" height="80" fill="#e5f4e8" stroke="#3f9a55"/>
  <text class="t" x="860" y="338">PSM2</text>
  <text class="s" x="860" y="357">left instrument</text>
  <text class="s" x="860" y="372">RCM at x = −50 mm</text>

  <!-- scene -->
  <rect class="box" x="470" y="445" width="170" height="80" fill="#fbe7ec" stroke="#b8475f"/>
  <text class="t" x="555" y="478">scene</text>
  <text class="s" x="555" y="497">targets, beads, vessels</text>
  <text class="s" x="555" y="512">grasping and scoring</text>

  <!-- your code -->
  <rect class="box" x="20" y="445" width="190" height="80" fill="#ffffff" stroke="#888" stroke-dasharray="6 4"/>
  <text class="t" x="115" y="478">your code</text>
  <text class="s" x="115" y="497">examples/ex1 … ex4</text>
  <text class="s" x="115" y="512">python -m minros …</text>

  <!-- arrows -->
  <line x1="172" y1="220" x2="228" y2="220" class="ln" marker-start="url(#a)"/>
  <text class="s" x="200" y="210">WebSocket</text>

  <path d="M400,185 L468,110" class="ln"/>
  <text class="topic" x="268" y="128">/MTMR/measured_cp</text>
  <text class="topic" x="268" y="143">/footpedals/clutch</text>
  <path d="M400,255 L468,330" class="ln"/>
  <text class="topic" x="268" y="305">/MTML/measured_cp</text>
  <text class="topic" x="268" y="320">/footpedals/clutch</text>

  <line x1="642" y1="85" x2="783" y2="85" class="ln"/>
  <text class="topic" x="650" y="76">/PSM1/servo_cp</text>
  <text class="topic" x="650" y="104">/PSM1/jaw/servo_jp</text>
  <line x1="642" y1="335" x2="783" y2="335" class="ln"/>
  <text class="topic" x="650" y="326">/PSM2/servo_cp</text>
  <text class="topic" x="650" y="354">/PSM2/jaw/servo_jp</text>

  <line x1="402" y1="220" x2="783" y2="220" class="ln"/>
  <text class="topic" x="425" y="212">/ECM/servo_jp</text>

  <path d="M860,387 L860,485 L642,485" class="ln"/>
  <text class="topic" x="680" y="477">/PSM1,2/measured_cp</text>

  <path d="M468,470 L260,470 L260,279" class="ln"/>
  <text class="topic" x="272" y="425">/scene/status</text>
  <text class="topic" x="272" y="440">/scene/targets</text>
  <text class="topic" x="272" y="455">/scene/vessels</text>

  <path d="M115,527 L115,560 L950,560 L950,95 L937,95" class="ln" stroke-dasharray="6 4"/>
  <text class="topic" x="130" y="552">/PSM1/servo_cp, /PSM1/servo_jp, /scene/start …  (your code can drive the robots directly)</text>

  <!-- broker -->
  <rect x="20" y="585" width="915" height="42" rx="8" fill="#2b2f36"/>
  <text x="477" y="611" fill="#ffffff" font-size="14" text-anchor="middle"><tspan font-weight="bold">minros broker</tspan>  ·  TCP port 11311  ·  every arrow above travels through it as a JSON line</text>
</svg>
